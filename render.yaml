services:
  - type: web
    name: edufutura-ai
    env: node
    plan: free
    region: singapore # Paling cepat & rendah latensi untuk pengguna Indonesia
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Masukkan API Key Gemini Anda di Dashboard Render
      - key: AUTH_USERNAME
        value: "www.yefriharyanto.id"
      - key: AUTH_PASSWORD
        value: "123456"
